name = "sidra-tourism-private-admin"
main = "src/admin-worker.js"
compatibility_date = "2026-11-15"

[assets]
directory = "./admin-ui"
binding = "ASSETS"
run_worker_first = true

# Deploy to a SIDRA-ONLY Cloudflare account and stage first.
# Secure staff.sidra-tourism.com using Cloudflare Zero Trust Access.
# Required (configured privately, never committed):
# ACCESS_TEAM_DOMAIN (example: sidra-team.cloudflareaccess.com)
# ACCESS_AUD (Access application AUD tag)
# SIDRA_ADMIN_EMAIL = admin@sidra-tourism.com
# [[d1_databases]]
# binding = "SIDRA_DB"
# database_name = "sidra-tourism"
# database_id = "REAL_SIDRA_ONLY_D1_DATABASE_ID"
# Do NOT expose workers.dev to public unauthenticated access.