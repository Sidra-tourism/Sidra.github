name: Sidra independent free stack tests
on:
  push:
    branches:
      - feature/sidra-free-independent-stack
    paths:
      - 'sidra-free/**'
      - '.github/workflows/sidra-free-tests.yml'
  pull_request:
    paths:
      - 'sidra-free/**'
      - '.github/workflows/sidra-free-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidra-free
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify ESM syntax
        run: |
          node --check src/worker.js
          node --check site/app.js
      - name: Test validation, abuse controls and fail-closed behavior
        run: npm test
