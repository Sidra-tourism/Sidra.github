name: Sidra owner admin portal checks
on:
  pull_request:
    paths:
      - 'admin/**'
      - '.github/workflows/sidra-owner-admin.yml'
  push:
    branches: [feature/sidra-owner-admin-subdomain-20261116]
    paths:
      - 'admin/**'
      - '.github/workflows/sidra-owner-admin.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax verify
        run: |
          node --check server.js
          node --check security.js
          node --check public/app.js
      - name: Install admin runtime dependencies for integration tests
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Security and UI tests
        run: npm test
