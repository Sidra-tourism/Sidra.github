name: Sidra travel operations verification
on:
  push:
    branches: [feature/sidra-travel-operations-20261116]
  pull_request:
    paths:
      - 'admin/**'
      - '.github/workflows/sidra-operations.yml'
permissions:
  contents: read
jobs:
  operations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check server.js
          node --check security.js
          node --check public/app.js
      - run: npm test
